        projRailUpdate();
      }

      function projOpenFeat(btn) {
        if (!projPage || !projFeatOverlay || !btn) return;
        var id = btn.getAttribute("data-feat") || "";
        var groups = PROJ_FEAT_GROUPS[id] || [];
        var shotCount = 0;
        projFeatOrbs.forEach(function (b) { b.classList.toggle("is-open", b === btn); });
        if (projFeatTitle) projFeatTitle.textContent = btn.getAttribute("data-title") || "";
        if (projFeatLead) projFeatLead.textContent = btn.getAttribute("data-lead") || "";
        if (projFeatBody) {
          projFeatBody.replaceChildren();
          if (!groups.length) {
            var empty = document.createElement("p");
            empty.className = "proj-feat-empty";
            empty.textContent = "截图待补充";
            projFeatBody.appendChild(empty);
          } else {
            groups.forEach(function (group) {
              var wrap = document.createElement("section");
              wrap.className = "proj-feat-group";
              if (group.name) {
                var h = document.createElement("h4");
                h.textContent = group.name;
                wrap.appendChild(h);
              }
              var row = document.createElement("div");
              row.className = "proj-feat-shots" + (group.wide ? " is-wide" : "") + (group.pano ? " is-pano" : "");
              if (!group.wide) row.style.setProperty("--n", String(Math.max(group.shots.length, 1)));
              group.shots.forEach(function (src, i) {
                var shot = projFeatShot(src, i, group.wide);
                shot.style.setProperty("--k", String(Math.min(shotCount++, 8)));
                row.appendChild(shot);
              });
              wrap.appendChild(row);
              projFeatBody.appendChild(wrap);
            });
          }
          projFeatBody.scrollLeft = 0;
          projFeatTarget = null;
          projFeatInertia = 0;
          projFeatLast = 0;
          projFeatSkew = 0;
          projFeatBody.classList.remove("is-bump-start", "is-bump-end");
        }
        if (projFeatNavTitle) {
          projFeatNavTitle.textContent = btn.getAttribute("data-title") || "";
          if (groups.length > 1) {
            var groupCount = document.createElement("span");
            groupCount.textContent = groups.length + " 组 · " + shotCount + " 张";
            projFeatNavTitle.appendChild(groupCount);
          }
        }
        projPage.classList.add("is-feat-open");
        projFeatOverlay.setAttribute("aria-hidden", "false");
        if (track) track.style.overflowY = "hidden";
        projRailUpdate();
        projFeatNavUpdate();
        if (!reduced) projFeatKick();
        if (projFeatClose) projFeatClose.focus({ preventScroll: true });
      }

      var projVideoIO = null;
      function projAutoplay(video) {
        if (reduced || !("IntersectionObserver" in window) || video.dataset.autoplay) return;
        video.dataset.autoplay = "1";
        video.muted = true;
        if (!projVideoIO) {
          projVideoIO = new IntersectionObserver(function (entries) {
            entries.forEach(function (en) {
              var v = en.target;              if (en.isIntersecting && en.intersectionRatio >= 0.5) {
                var p = v.play();
                if (p && p.catch) p.catch(function () {});
              } else if (!v.paused) {
                v.pause();
              }
            });
          }, { root: track, threshold: [0, 0.5] });
        }
        projVideoIO.observe(video);
      }

      function projBindVideos() {
        projPanels.forEach(function (panel) {
          var video = panel.querySelector(".proj-video");
          var ph = panel.querySelector(".proj-media-placeholder");
          if (!video) return;
          var src = (panel.getAttribute("data-video") || "").trim();
          var poster = (panel.getAttribute("data-poster") || "").trim();
          if (poster) video.setAttribute("poster", poster);
          else video.removeAttribute("poster");
          if (src) {
            if (video.getAttribute("src") !== src) video.src = src;
            video.classList.add("is-on");
            if (ph) ph.classList.add("is-hidden");
            projAutoplay(video);
          } else {
            video.removeAttribute("src");
            video.classList.remove("is-on");
            if (ph) ph.classList.remove("is-hidden");
          }
        });
      }

      var projRail = document.getElementById("projRail");
      var projRailItems = projRail ? projRail.querySelectorAll(".proj-rail-item") : [];
      var projDetailView = document.getElementById("projDetailView");

      function projMarkCurrent(index) {
        index = Number(index);
        if (Number.isNaN(index)) return;
        projCurrentIndex = index;
        [projIpCards, projPanels, projRailItems].forEach(function (list) {
          list.forEach(function (el) {
            el.classList.toggle("is-current", Number(el.getAttribute("data-proj-index")) === index);
          });
        });
      }

      function projRailUpdate() {
        if (!projRail || !projDetailView || !track) return;
        var vh = track.clientHeight;
        var r = projDetailView.getBoundingClientRect();
        var featOpen = projPage && projPage.classList.contains("is-feat-open");
        projRail.classList.toggle("is-show", !featOpen && r.top < vh * 0.45 && r.bottom > vh * 0.55);
        var fill = (vh * 0.5 - r.top) / r.height;
        projRail.style.setProperty("--rail-fill", Math.max(0, Math.min(1, fill)).toFixed(4));
      }

      function projCountUp(panel) {
        panel.querySelectorAll(".proj-kpi dt").forEach(function (dt) {
          var m = dt.textContent.trim().match(/^(\+?)(\d+(?:\.\d+)?)(%)$/);
          if (!m) return;
          var target = Number(m[2]);
          var decimals = (m[2].split(".")[1] || "").length;
          var start = 0;
          dt.textContent = m[1] + (0).toFixed(decimals) + m[3];
          setTimeout(function () {
            (function step(ts) {
              if (!start) start = ts;
              var p = Math.max(0, Math.min((ts - start) / 1200, 1));
              dt.textContent = m[1] + (target * (1 - Math.pow(1 - p, 3))).toFixed(decimals) + m[3];
              if (p < 1) requestAnimationFrame(step);
            })(performance.now());
          }, 300);
        });
      }

      function projScrollTo(index) {
        index = Number(index);
        if (Number.isNaN(index)) return;
        projCloseFeat();
        var panel = document.querySelector('.proj-panel[data-proj-index="' + index + '"]');
        var card = document.querySelector('.proj-ip-card[data-proj-index="' + index + '"]');
        if (card) card.classList.add("is-visited");
        projMarkCurrent(index);
        if (panel) {
          panel.scrollIntoView({ behavior: reduced ? "auto" : "smooth", block: "start" });
          if (!reduced) {
            panel.classList.remove("is-landed");
            void panel.offsetWidth;
            panel.classList.add("is-landed");
            setTimeout(function () { panel.classList.remove("is-landed"); }, 2300);
          }
        }
      }

      projRailItems.forEach(function (item) {
        item.addEventListener("click", function () {
          projScrollTo(item.getAttribute("data-proj-index"));
        });
      });

      if (track && projRail) {
        var projRailTicking = false;
        track.addEventListener("scroll", function () {
          if (projRailTicking) return;
          projRailTicking = true;
          requestAnimationFrame(function () {
            projRailTicking = false;
            projRailUpdate();
          });
        }, { passive: true });
        window.addEventListener("resize", projRailUpdate);
      }

      var projHub = document.getElementById("projHub");
      var projStage = document.getElementById("projStage");

      function projRevealPanel(panel) {
        if (!panel || panel.classList.contains("is-in")) return;
        panel.classList.add("is-in");
        projCountUp(panel);
      }

      function projRevealVisible() {
        if (projHub) projHub.classList.add("is-in");
        var rootBox = track ? track.getBoundingClientRect() : { top: 0, bottom: window.innerHeight };
        projPanels.forEach(function (panel) {
          var r = panel.getBoundingClientRect();
          if (r.bottom > rootBox.top + 40 && r.top < rootBox.bottom - 40) projRevealPanel(panel);
        });
      }
      window.__projRevealVisible = projRevealVisible;

      if (track && !reduced && "IntersectionObserver" in window) {
        if (projHub) projHub.classList.add("js-reveal");
        if (projStage) projStage.classList.add("js-reveal");
        var projRevealIo = new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            if (!entry.isIntersecting) return;
            if (entry.target.classList.contains("proj-panel")) projRevealPanel(entry.target);
            else entry.target.classList.add("is-in");
            projRevealIo.unobserve(entry.target);
          });
        }, { root: track, rootMargin: "15% 0px", threshold: 0 });
        if (projHub) projRevealIo.observe(projHub);
        projPanels.forEach(function (panel) { projRevealIo.observe(panel); });
      } else {
        if (projHub) projHub.classList.add("is-in");
        projPanels.forEach(function (panel) { projRevealPanel(panel); });
      }

      projBindVideos();

      if (track && projPanels.length) {
        var projSpy = new IntersectionObserver(function (entries) {
          var best = null;
          entries.forEach(function (entry) {
            if (!entry.isIntersecting) return;
            if (!best || entry.intersectionRatio > best.intersectionRatio) best = entry;
          });
          if (best && best.target) {
            projMarkCurrent(best.target.getAttribute("data-proj-index"));
          }
        }, { root: track, rootMargin: "-18% 0px -55% 0px", threshold: [0.15, 0.35, 0.6] });
        projPanels.forEach(function (panel) { projSpy.observe(panel); });
      }

      projIpCards.forEach(function (card) {
        card.addEventListener("click", function () {
          projScrollTo(card.getAttribute("data-proj-index"));
        });
      });
      projFeatOrbs.forEach(function (btn) {
        btn.addEventListener("click", function () { projOpenFeat(btn); });
      });
      if (projFeatClose) projFeatClose.addEventListener("click", function () { projCloseFeat(); });
      if (projFeatBackdrop) projFeatBackdrop.addEventListener("click", function () { projCloseFeat(); });

      /* 素材平台：原型截图 / 流程图 / 架构图预览，同组可切换，大图可点击放大细看 */
      var ascLb = document.getElementById("ascLightbox");
      if (ascLb) {
        var ascLbImg = document.getElementById("ascLbImg");
        var ascLbScroll = document.getElementById("ascLbScroll");
        var ascLbCap = document.getElementById("ascLbCap");
        var ascLbCount = document.getElementById("ascLbCount");
        var ascLbList = [];
        var ascLbIdx = 0;
        var ascLbReturn = null;
        var ascLbCheckZoom = function () {
          if (!ascLbImg.complete || !ascLbImg.naturalWidth) return;
          ascLb.classList.toggle("can-zoom", ascLbImg.naturalWidth > ascLbImg.clientWidth * 1.25);
        };
        var ascLbShow = function (i) {
          ascLbIdx = (i + ascLbList.length) % ascLbList.length;
          var b = ascLbList[ascLbIdx];
          var cap = b.getAttribute("data-lb-cap") || "";
          ascLb.classList.remove("is-zoomed", "can-zoom");
          ascLbImg.src = b.getAttribute("data-lb-src");
          ascLbImg.alt = cap;
          ascLbCap.textContent = cap;
          ascLbCount.textContent = ascLbList.length > 1 ? (ascLbIdx + 1) + " / " + ascLbList.length : "";
          ascLb.classList.toggle("is-single", ascLbList.length < 2);
          ascLbScroll.scrollTop = 0;
          ascLbScroll.scrollLeft = 0;
          requestAnimationFrame(ascLbCheckZoom);
        };
        var ascLbVideo = document.getElementById("ascLbVideo");
        var ascLbOpen = function (btn) {
          ascLbReturn = btn;
          ascLb.classList.add("is-open");
          ascLb.setAttribute("aria-hidden", "false");
          ascLb.querySelector(".is-close").focus({ preventScroll: true });
        };
        var ascLbClose = function () {
          if (!ascLb.classList.contains("is-open")) return;
          ascLb.classList.remove("is-open", "is-zoomed");
          ascLb.setAttribute("aria-hidden", "true");
          if (ascLb.classList.contains("is-video")) {
            ascLbVideo.pause();
            ascLbVideo.removeAttribute("src");
            ascLbVideo.load();
            ascLb.classList.remove("is-video");
          }
          if (ascLbReturn) ascLbReturn.focus({ preventScroll: true });
        };
        ascLbImg.addEventListener("load", ascLbCheckZoom);
        document.querySelectorAll("[data-lb-src]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            ascLbList = Array.prototype.slice.call(document.querySelectorAll('[data-lb-group="' + btn.getAttribute("data-lb-group") + '"]'));
            ascLb.classList.remove("is-video");
            ascLbShow(ascLbList.indexOf(btn));
            ascLbOpen(btn);
          });
        });
        document.querySelectorAll("[data-lb-video]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            ascLbList = [];
            ascLb.classList.remove("is-zoomed", "can-zoom");
            ascLb.classList.add("is-video", "is-single");
            ascLbCap.textContent = btn.getAttribute("data-lb-cap") || "";
            ascLbCount.textContent = "";
            document.querySelectorAll(".asc-player video").forEach(function (v) { v.pause(); });
            var vidSrc = btn.getAttribute("data-lb-video") || "";
            ascLbVideo.src = encodeURI(vidSrc);
            ascLbOpen(btn);
            var p = ascLbVideo.play();
            if (p && p.catch) {
              p.catch(function () {
                ascLbVideo.load();
                ascLbVideo.play().catch(function () {});
              });
            }
          });
        });
        document.querySelectorAll(".asc-player").forEach(function (pl) {
          var v = pl.querySelector("video");
          var playBtn = pl.querySelector(".asc-player-play");
          if (!v || !playBtn) return;
          if (v.getAttribute("src")) v.src = encodeURI(decodeURI(v.getAttribute("src")));
          playBtn.addEventListener("click", function () {
            pl.classList.add("is-playing");
            v.controls = true;
            if (v.readyState === 0) v.load();
            var p = v.play();
            if (p && p.catch) {
              p.catch(function () {
                v.load();
                v.play().catch(function () {});
              });
            }
          });
        });
        ascLb.querySelectorAll("[data-lb-close]").forEach(function (el) { el.addEventListener("click", ascLbClose); });
        document.getElementById("ascLbPrev").addEventListener("click", function () { ascLbShow(ascLbIdx - 1); });
        document.getElementById("ascLbNext").addEventListener("click", function () { ascLbShow(ascLbIdx + 1); });
        ascLbImg.addEventListener("click", function (e) {
          if (!ascLb.classList.contains("can-zoom")) return;
          var r = ascLbImg.getBoundingClientRect();
          var fx = (e.clientX - r.left) / r.width;
          var fy = (e.clientY - r.top) / r.height;
          if (!ascLb.classList.toggle("is-zoomed")) return;
          ascLbImg.style.setProperty("--zoom-w", Math.min(ascLbImg.naturalWidth, 2800) + "px");
          requestAnimationFrame(function () {
            ascLbScroll.scrollLeft = fx * ascLbImg.clientWidth - ascLbScroll.clientWidth / 2;
            ascLbScroll.scrollTop = fy * ascLbImg.clientHeight - ascLbScroll.clientHeight / 2;
          });
        });
        window.addEventListener("keydown", function (e) {
          if (!ascLb.classList.contains("is-open")) return;
          var step = e.key === "ArrowRight" ? 1 : e.key === "ArrowLeft" ? -1 : 0;
          if (ascLb.classList.contains("is-video")) step = 0;
          if (e.key !== "Escape" && !step) return;
          e.preventDefault();
          e.stopImmediatePropagation();
          if (e.key === "Escape") ascLbClose();
          else if (ascLbList.length > 1) ascLbShow(ascLbIdx + step);
        }, true);
      }

      /* 履历文档：左侧文档 ↔ 右侧文案关键词/句子 悬停互相高亮 */
      document.querySelectorAll(".exp-row.has-docs").forEach(function (row) {
        var pairs = row.querySelectorAll("[data-doc]");
        var setLinked = function (key, on) {
          if (!key) return;
          pairs.forEach(function (el) {
            if (el.getAttribute("data-doc") === key) el.classList.toggle("is-linked", on);
          });
        };
        pairs.forEach(function (el) {
          var key = el.getAttribute("data-doc");
          el.addEventListener("pointerenter", function () { setLinked(key, true); });
          el.addEventListener("pointerleave", function () { setLinked(key, false); });
          if (el.tagName === "A") {
            el.addEventListener("focus", function () { setLinked(key, true); });
            el.addEventListener("blur", function () { setLinked(key, false); });
          }
        });
      });

      /* 莱嗯主营产品：文案产品名 ↔ 右侧 icon 悬停互相高亮 */
      document.querySelectorAll(".exp-row.has-apps").forEach(function (row) {
        var pairs = row.querySelectorAll("[data-app]");
        var setLinked = function (key, on) {
          if (!key) return;
          pairs.forEach(function (el) {
            if (el.getAttribute("data-app") === key) el.classList.toggle("is-linked", on);
          });
        };
        pairs.forEach(function (el) {
          var key = el.getAttribute("data-app");
          el.addEventListener("pointerenter", function () { setLinked(key, true); });
          el.addEventListener("pointerleave", function () { setLinked(key, false); });
          if (el.tagName === "A") {
            el.addEventListener("focus", function () { setLinked(key, true); });
            el.addEventListener("blur", function () { setLinked(key, false); });
          }
        });
      });

      /* 闹钟系列：参考 AI 展示的底部横向切换 */
      var csRoot = document.getElementById("clockStory");
      if (csRoot) {
        var csNav = csRoot.querySelectorAll(".cs-nav-item");
        var csScenes = csRoot.querySelectorAll(".cs-scene");
        var csStage = document.getElementById("csStage");
        var csPrev = document.getElementById("csPrev");
        var csNext = document.getElementById("csNext");
        var csCur = 0;
        var csLeaveTimer = 0;
        var csTotal = csScenes.length;
        csRoot.style.setProperty("--cs-n", String(csTotal));
        var csSyncCtrl = function () {
          if (csPrev) csPrev.disabled = csCur <= 0;
          if (csNext) csNext.disabled = csCur >= csTotal - 1;
        };
        var csGo = function (i, focus) {
          if (i === csCur || i < 0 || i >= csTotal) return;
          if (csStage) csStage.style.setProperty("--dx", i > csCur ? "36px" : "-36px");
          var prev = csScenes[csCur];
          csScenes.forEach(function (s) { s.classList.remove("is-leaving"); });
          prev.classList.remove("is-active");
          prev.classList.add("is-leaving");
          clearTimeout(csLeaveTimer);
          csLeaveTimer = setTimeout(function () { prev.classList.remove("is-leaving"); }, reduced ? 0 : 1100);
          csCur = i;
          csScenes[i].classList.add("is-active");
          csNav.forEach(function (n, k) {
            var on = k === i;
            n.classList.toggle("is-active", on);
            n.setAttribute("aria-selected", on ? "true" : "false");
            n.tabIndex = on ? 0 : -1;
          });
          csRoot.style.setProperty("--p", String(i / csTotal));
          csRoot.style.setProperty("--cs-accent-cur", csNav[i].style.getPropertyValue("--cs-accent") || "#7aa2ff");
          csSyncCtrl();
          if (focus) csNav[i].focus({ preventScroll: true });
        };
        csNav.forEach(function (n, k) {
          n.addEventListener("click", function () { csGo(k); });
          n.addEventListener("keydown", function (e) {
            var step = e.key === "ArrowRight" || e.key === "ArrowDown" ? 1 : e.key === "ArrowLeft" || e.key === "ArrowUp" ? -1 : 0;
            if (!step) return;
            e.preventDefault();
            e.stopPropagation();
            csGo(Math.max(0, Math.min(csTotal - 1, csCur + step)), true);
          });
        });
        if (csPrev) csPrev.addEventListener("click", function () { csGo(csCur - 1); });
        if (csNext) csNext.addEventListener("click", function () { csGo(csCur + 1); });
        csSyncCtrl();
        if (csStage && !reduced && window.matchMedia("(hover: hover)").matches) {
          csStage.addEventListener("pointermove", function (e) {
            var r = csStage.getBoundingClientRect();
            csStage.style.setProperty("--px", ((e.clientX - r.left) / r.width - 0.5).toFixed(3));
            csStage.style.setProperty("--py", ((e.clientY - r.top) / r.height - 0.5).toFixed(3));
          });
          csStage.addEventListener("pointerleave", function () {
            csStage.style.setProperty("--px", "0");
            csStage.style.setProperty("--py", "0");
          });
        }
      }

      
    })();
  </script>
</body>
</html>

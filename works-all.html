<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="刘敏 — 全部作品" />
  <title>全部作品 · 刘敏</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Noto+Serif+SC:wght@500;600;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
<style>
    :root {
      --bg: #0a0a0b;
      --bg-elevated: #121214;
      --card: #161618;
      --card-border: rgba(255, 255, 255, 0.08);
      --lime: #ccff00;
      --lime-dim: rgba(204, 255, 0, 0.15);
      --text: #f5f5f7;
      --muted: #9ca3af;
      --font-ui: "DM Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
      --font-serif: "Noto Serif SC", "Songti SC", serif;
      --font-display: "Space Grotesk", "DM Sans", sans-serif;
      --space: clamp(16px, 3vw, 40px);
      --page-gutter: clamp(48px, 14vw, 280px);
      --page-max: 1060px;
      --nav-rail: 132px;
      --header-h: 28px;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --rhythm: clamp(32px, 5.5vh, 64px);
    }
    @media (max-width: 760px) {
      :root {
        --page-gutter: max(20px, 6vw);
        --nav-rail: 88px;
        --header-h: 20px;
      }
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: var(--font-ui);
      font-size: 15px;
      line-height: 1.6;
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }

    :focus-visible {
      outline: 2px solid var(--lime);
      outline-offset: 3px;
    }

    /* —— Header：左侧竖向导航 —— */
    .site-header {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      z-index: 200;
      width: var(--nav-rail);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 14px;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(10, 10, 11, 0.88) 0%, rgba(10, 10, 11, 0.42) 68%, transparent 100%);
    }
    .site-header > * { pointer-events: auto; }

    .site-nav {
      --nav-p: 0;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: center;
      gap: 4px;
      width: 100%;
      max-width: 112px;
      padding: 18px 12px;
      border-radius: 22px;
      background:
        linear-gradient(165deg, rgba(255, 255, 255, 0.055) 0%, rgba(255, 255, 255, 0.015) 100%);
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 0.06),
        0 18px 40px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }
    .site-nav::before,
    .site-nav-progress {
      content: "";
      position: absolute;
      left: 21px;
      top: 34px;
      width: 1px;
      pointer-events: none;
    }
    .site-nav::before {
      bottom: 34px;
      background: linear-gradient(180deg, transparent, rgba(255, 255, 255, 0.14) 12%, rgba(255, 255, 255, 0.14) 88%, transparent);
    }
    .site-nav-progress {
      height: calc((100% - 68px) * var(--nav-p));
      background: linear-gradient(180deg, rgba(204, 255, 0, 0.15), var(--lime));
      box-shadow: 0 0 12px rgba(204, 255, 0, 0.35);
      transition: height 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* 悬浮小唱片：默认右上角，可拖动，旋转与主盘同步 */
    .tt-mini {
      --tt-mini-x: 0px;
      --tt-mini-y: 28px;
      appearance: none;
      position: fixed;
      left: var(--tt-mini-x);
      top: var(--tt-mini-y);
      z-index: 220;
      width: 96px;
      height: 96px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 30%, #222226, #0a0a0c 72%);
      cursor: grab;
      touch-action: none;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateY(8px) scale(0.92);
      transition:
        opacity 0.28s var(--ease),
        visibility 0.28s,
        transform 0.32s cubic-bezier(0.22, 1, 0.36, 1),
        box-shadow 0.3s ease;
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.16),
        0 3px 0 #1a1a1d,
        0 6px 0 #101012,
        0 14px 28px rgba(0, 0, 0, 0.55),
        0 0 28px rgba(204, 255, 0, 0.1),
        inset 0 1px 1px rgba(255, 255, 255, 0.12);
    }
    .tt-mini.is-visible {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translateY(0) scale(1);
    }
    .tt-mini.is-dragging {
      cursor: grabbing;
      transition: none;
      transform: scale(1.04);
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.18),
        0 3px 0 #1a1a1d,
        0 6px 0 #101012,
        0 22px 40px rgba(0, 0, 0, 0.65),
        0 0 36px rgba(204, 255, 0, 0.22),
        inset 0 1px 1px rgba(255, 255, 255, 0.14);
    }
    .tt-mini:focus-visible {
      outline: 2px solid rgba(204, 255, 0, 0.65);
      outline-offset: 4px;
    }
    .tt-mini-disc {
      position: absolute;
      inset: 6%;
      border-radius: 50%;
      background:
        repeating-radial-gradient(closest-side, #0a0a0b 0 0.9px, #161618 0.9px 1.8px);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06), inset 0 0 12px rgba(0, 0, 0, 0.45);
      will-change: transform;
    }
    .tt-mini-accent {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: conic-gradient(
        from 150deg,
        transparent 0deg,
        rgba(204, 255, 0, 0.15) 20deg,
        #e8ff52 90deg,
        rgba(204, 255, 0, 0.2) 160deg,
        transparent 185deg,
        transparent 360deg
      );
      -webkit-mask: radial-gradient(closest-side, transparent 93%, #000 94.5%, #000 97.5%, transparent 99%);
      mask: radial-gradient(closest-side, transparent 93%, #000 94.5%, #000 97.5%, transparent 99%);
      filter: drop-shadow(0 0 2px rgba(204, 255, 0, 0.55));
      pointer-events: none;
    }
    .tt-mini-label {
      position: absolute;
      inset: 12%;
      border-radius: 50%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 30%, #d8ff33, var(--lime) 72%);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      box-shadow: 0 0 0 1.5px #0a0a0b, inset 0 -4px 8px rgba(0, 0, 0, 0.15);
    }
    .tt-mini-label img {
      display: block;
      width: 100%;
      height: auto;
      margin-bottom: -8%;
      pointer-events: none;
    }
    .tt-mini-sheen {
      position: absolute;
      inset: 6%;
      border-radius: 50%;
      background: conic-gradient(
        from 30deg,
        transparent 0deg,
        rgba(255, 255, 255, 0.28) 22deg,
        transparent 50deg,
        transparent 190deg,
        rgba(255, 255, 255, 0.16) 210deg,
        transparent 240deg
      );
      -webkit-mask: radial-gradient(closest-side, transparent 55%, #000 58%, #000 96%, transparent 99%);
      mask: radial-gradient(closest-side, transparent 55%, #000 58%, #000 96%, transparent 99%);
      mix-blend-mode: soft-light;
      pointer-events: none;
    }
    .tt-mini-state {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: none;
      border: none;
      box-shadow: none;
      color: rgba(255, 255, 255, 0.72);
      pointer-events: none;
      z-index: 2;
    }
    .tt-mini-state svg {
      width: 28px;
      height: 28px;
      opacity: 0.55;
      filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.55));
    }
    .tt-mini-ico-play { translate: 1px 0; }
    .tt-mini-ico-pause,
    .tt-mini.is-playing .tt-mini-ico-play { display: none; }
    .tt-mini.is-playing .tt-mini-ico-pause { display: block; }
    body:has(.asc-lightbox.is-open) .tt-mini.is-visible,
    body:has(.works-theater.is-detail-open) .tt-mini.is-visible {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .site-nav a {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 42px;
      padding: 6px 8px 6px 0;
      border-radius: 12px;
      text-decoration: none;
      color: rgba(255, 255, 255, 0.42);
      transition: color 0.35s var(--ease), background 0.35s var(--ease), transform 0.35s var(--ease);
    }
    .site-nav .nav-dot {
      position: relative;
      z-index: 1;
      flex: 0 0 auto;
      width: 11px;
      height: 11px;
      margin-left: 5px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.28);
      background: #0a0a0c;
      box-shadow: 0 0 0 3px rgba(10, 10, 11, 0.9);
      transition: background 0.4s var(--ease), border-color 0.4s var(--ease), box-shadow 0.4s var(--ease), transform 0.4s var(--ease);
    }
    .site-nav .nav-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 1px;
      min-width: 0;
    }
    .site-nav .nav-no {
      font-family: var(--font-display);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: rgba(255, 255, 255, 0.22);
      transition: color 0.35s var(--ease);
    }
    .site-nav .nav-label {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
      white-space: nowrap;
      transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1), color 0.35s var(--ease);
    }
    .site-nav a:hover {
      color: rgba(255, 255, 255, 0.86);
      background: rgba(255, 255, 255, 0.03);
    }
    .site-nav a:hover .nav-label { transform: translateX(3px); }
    .site-nav a:hover .nav-dot {
      border-color: rgba(204, 255, 0, 0.55);
      box-shadow: 0 0 0 3px rgba(10, 10, 11, 0.9), 0 0 10px rgba(204, 255, 0, 0.25);
    }
    .site-nav a.is-active {
      color: #fff;
      background: linear-gradient(90deg, rgba(204, 255, 0, 0.12), transparent 86%);
    }
    .site-nav a.is-active .nav-label {
      font-weight: 700;
      transform: translateX(4px);
      color: var(--lime);
    }
    .site-nav a.is-active .nav-no { color: var(--lime); }
    .site-nav a.is-active .nav-dot {
      transform: scale(1.15);
      border-color: var(--lime);
      background: var(--lime);
      box-shadow:
        0 0 0 3px rgba(10, 10, 11, 0.95),
        0 0 0 5px rgba(204, 255, 0, 0.16),
        0 0 18px rgba(204, 255, 0, 0.55);
    }
    .site-nav a:focus-visible {
      outline: 2px solid rgba(204, 255, 0, 0.55);
      outline-offset: 2px;
    }

    .progress-line {
      position: fixed;
      top: 0;
      left: 0;
      height: 2px;
      width: 0;
      background: var(--lime);
      z-index: 201;
      transition: width 0.4s var(--ease);
    }

    .page-indicator {
      position: fixed;
      right: var(--space);
      bottom: 16px;
      z-index: 200;
      font-size: 11px;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    .scroll-hint {
      position: fixed;
      left: calc(var(--nav-rail) + 8px);
      bottom: 16px;
      z-index: 200;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.35);
    }

    /* —— Vertical track —— */
    .track {
      position: relative;
      display: block;
      width: 100%;
      height: 100dvh;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior-y: contain;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .track::-webkit-scrollbar { width: 0; height: 0; }
    .slide::-webkit-scrollbar { width: 0; height: 0; display: none; }

    .slide {
      width: 100%;
      min-height: 100dvh;
      height: auto;
      overflow: visible;
      padding: calc(var(--header-h) + 16px) var(--page-gutter) var(--space) max(var(--page-gutter), calc(var(--nav-rail) + 20px));
      background: var(--bg);
      position: relative;
    }
    .slide::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 70% 20%, rgba(204, 255, 0, 0.06) 0%, transparent 55%),
        radial-gradient(ellipse 40% 30% at 20% 80%, rgba(255, 255, 255, 0.03) 0%, transparent 50%);
      pointer-events: none;
    }
    .slide + .slide::after {
      content: "";
      position: absolute;
      top: 0;
      left: 50%;
      z-index: 2;
      width: min(1200px, calc(100% - 2 * var(--page-gutter)));
      height: 15px;
      transform: translate(-50%, -50%);
      background:
        radial-gradient(circle, #ccff00 0 2px, transparent 2.6px 4.8px, rgba(204, 255, 0, 0.6) 5.2px 5.9px, transparent 6.4px)
          center / 15px 15px no-repeat,
        linear-gradient(90deg, transparent 0%, rgba(204, 255, 0, 0.1) 8%, rgba(204, 255, 0, 0.28) 22%, rgba(204, 255, 0, 0.6) 36%, rgba(204, 255, 0, 0.95) calc(50% - 13px), transparent calc(50% - 12px) calc(50% + 12px), rgba(204, 255, 0, 0.95) calc(50% + 13px), rgba(204, 255, 0, 0.6) 64%, rgba(204, 255, 0, 0.28) 78%, rgba(204, 255, 0, 0.1) 92%, transparent 100%)
          center / 100% 1px no-repeat,
        linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.14) 12%, rgba(255, 255, 255, 0.14) calc(50% - 12px), transparent calc(50% - 12px) calc(50% + 12px), rgba(255, 255, 255, 0.14) calc(50% + 12px), rgba(255, 255, 255, 0.14) 88%, transparent 100%)
          center / 100% 1px no-repeat,
        radial-gradient(closest-side, rgba(204, 255, 0, 0.22), transparent)
          center / 360px 15px no-repeat;
      pointer-events: none;
    }
    .slide-inner {
      position: relative;
      z-index: 1;
      max-width: 1200px;
      margin: 0 auto;
      height: 100%;
    }

    /* —— HOME：内容不足一屏时居中，超出则在本屏内纵向滚动 —— */
    .slide--home {
      padding-top: calc(var(--header-h) + 8px);
      padding-bottom: clamp(48px, 8vh, 96px);
    }
    .slide--home .slide-inner {
      width: 100%;
      height: auto;
      max-width: none;
      min-height: calc(100dvh - var(--header-h) - 28px);
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .home-center {
      width: min(var(--page-max), 100%);
      margin: 0 auto;
    }
    .home-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 36px;
      justify-content: center;
      align-items: center;
    }
    @media (min-width: 860px) {
      .home-grid {
        grid-template-columns: minmax(0, 420px) minmax(0, 500px);
        gap: clamp(32px, 4.5vw, 64px);
        justify-content: center;
        align-items: center;
      }
    }
    .home-copy {
      position: relative;
      width: 100%;
      justify-self: center;
      max-width: 420px;
    }
    .home-intro {
      margin-bottom: 8px;
    }
    .home-hello {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--lime);
      margin: 0;
    }
    .home-title {
      position: relative;
      font-family: var(--font-serif);
      font-size: clamp(36px, 4.6vw, 52px);
      font-weight: 900;
      line-height: 1.08;
      margin: 0 0 18px;
      padding: 0 0 14px;
      border: none;
    }
    .home-title-line {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 8px 12px;
    }
    .home-title-name {
      position: relative;
      display: inline-block;
      margin-right: 0.48em;
      color: var(--lime);
      letter-spacing: 0.02em;
    }
    .home-title-name::after {
      content: "";
      position: absolute;
      top: 0.08em;
      right: -0.38em;
      width: 0.22em;
      height: 0.22em;
      border: 1.5px solid var(--lime);
      border-radius: 50%;
      opacity: 0.9;
    }
    .home-title-meta {
      font-family: var(--font-ui);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: rgba(255, 255, 255, 0.48);
      white-space: nowrap;
      transform: translateY(-0.2em);
    }
    .home-isfp {
      position: relative;
      display: inline-block;
      color: rgba(255, 255, 255, 0.62);
      cursor: default;
      transition: color 0.3s var(--ease);
    }
    .home-isfp:hover,
    .home-isfp:focus-visible {
      color: var(--lime);
      outline: none;
    }
    .home-isfp-peek {
      position: absolute;
      z-index: 8;
      left: 50%;
      bottom: calc(100% + 10px);
      width: min(200px, 46vw);
      aspect-ratio: 1;
      border-radius: 16px;
      overflow: hidden;
      background: #0a0a0b;
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.1),
        0 22px 48px -14px rgba(0, 0, 0, 0.78);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateX(-50%) translateY(8px) scale(0.92);
      transform-origin: 50% 100%;
      transition: opacity 0.3s var(--ease), transform 0.45s cubic-bezier(0.2, 0.9, 0.3, 1.2), visibility 0.3s;
    }
    .home-isfp-peek img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      background: #000;
    }
    @media (hover: hover) {
      .home-isfp:hover .home-isfp-peek,
      .home-isfp:focus-visible .home-isfp-peek {
        opacity: 1;
        visibility: visible;
        transform: translateX(-50%) translateY(0) scale(1);
      }
    }
    .home-title-role {
      display: block;
      margin-top: 2px;
      color: #fff;
      letter-spacing: 0.04em;
      font-weight: 900;
    }
    .home-title-role::after {
      content: "";
      display: block;
      width: 2.6em;
      height: 2px;
      margin-top: 10px;
      background: var(--lime);
      border-radius: 1px;
    }
    .home-stats {
      list-style: none;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0;
      margin: 0 0 16px;
      padding: 16px 4px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.045);
      border: 1px solid rgba(255, 255, 255, 0.09);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.05),
        0 8px 28px rgba(0, 0, 0, 0.22);
    }
    .home-stats li {
      text-align: center;
      padding: 0 10px;
      border-left: 1px solid rgba(255, 255, 255, 0.12);
    }
    .home-stats li:first-child { border-left: none; }
    .home-stats strong {
      display: block;
      font-family: var(--font-display);
      font-size: clamp(26px, 3.4vw, 34px);
      font-weight: 700;
      color: var(--lime);
      line-height: 1;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.03em;
      white-space: nowrap;
    }
    .home-stats span {
      display: block;
      margin-top: 6px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.02em;
      color: rgba(255, 255, 255, 0.72);
    }
    .home-actions {
      display: flex;
      flex-wrap: nowrap;
      gap: 12px;
      align-items: center;
    }
    .home-cta {
      appearance: none;
      position: relative;
      overflow: hidden;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-family: var(--font-ui);
      font-size: 13px;
      font-weight: 700;
      padding: 12px 22px;
      border: none;
      border-radius: 999px;
      background: var(--lime);
      color: #0a0a0b;
      cursor: pointer;
      box-shadow: 0 0 28px rgba(204, 255, 0, 0.22);
      transition: transform 0.3s var(--ease), box-shadow 0.3s var(--ease), background 0.25s ease, color 0.25s ease, border-color 0.25s ease;
    }
    .home-cta::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 30%;
      background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.55), transparent);
      transform: translateX(-120%) skewX(-20deg);
      pointer-events: none;
    }
    .home-cta-arrow {
      display: inline-block;
      transition: transform 0.35s var(--ease);
    }
    .home-cta:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 40px rgba(204, 255, 0, 0.32);
    }
    .home-cta:hover::after {

    .tt.is-playing .tt-platter {

        0 24px 38px rgba(0, 0, 0, 0.6),
        0 52px 88px -14px rgba(0, 0, 0, 0.96),
        0 0 130px -4px rgba(204, 255, 0, 0.22),
        inset 0 3px 4px rgba(255, 255, 255, 0.18),

        inset 0 0 0 1px rgba(255, 255, 255, 0.07);

    .tt-disc {
      position: absolute;
      inset: 4.5%;
      border-radius: 50%;
      background:
        radial-gradient(closest-side at 50% 50%,
          transparent 57%,
          rgba(255, 255, 255, 0.05) 58%,
          transparent 59.5%,
          transparent 72%,
          rgba(255, 255, 255, 0.04) 73%,
          transparent 74.5%,
          transparent 88%,
          rgba(255, 255, 255, 0.035) 89%,
          transparent 91%,
          rgba(0, 0, 0, 0.55) 100%),
        repeating-radial-gradient(closest-side,
          #0a0a0b 0 1.1px,
          #17171a 1.1px 2.2px,
          #0e0e10 2.2px 3.3px);
      box-shadow:
        0 0 0 1px #050505,
        0 4px 10px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.08),
        inset 0 -6px 16px rgba(0, 0, 0, 0.5),
        inset 0 0 40px rgba(0, 0, 0, 0.4);
      will-change: transform;

    /* 外圈绿色渐变弧：更细更长，随唱片转，不是进度填充 */
    .tt-accent {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: conic-gradient(
        from 128deg,
        transparent 0deg,
        rgba(204, 255, 0, 0.03) 12deg,
        rgba(204, 255, 0, 0.4) 40deg,
        #e8ff52 95deg,
        rgba(204, 255, 0, 0.5) 155deg,
        rgba(204, 255, 0, 0.1) 195deg,
        transparent 210deg,
        transparent 360deg
      );
      -webkit-mask: radial-gradient(closest-side, transparent 96.6%, #000 97%, #000 98%, transparent 98.5%);
      mask: radial-gradient(closest-side, transparent 96.6%, #000 97%, #000 98%, transparent 98.5%);
      filter: drop-shadow(0 0 2px rgba(204, 255, 0, 0.7)) drop-shadow(0 0 8px rgba(204, 255, 0, 0.28));
      pointer-events: none;
    }
    .tt-label {
      position: absolute;
      inset: 21%;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 30%, #d8ff33, var(--lime) 70%);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      overflow: hidden;
      box-shadow:
        0 0 0 2px #0a0a0b,
        0 0 0 3px rgba(255, 255, 255, 0.1),
        0 6px 14px rgba(0, 0, 0, 0.35),
        inset 0 2px 3px rgba(255, 255, 255, 0.25),
        inset 0 -12px 22px rgba(0, 0, 0, 0.18);
    }
    .tt-label img {
      display: block;
      width: 100%;
      height: auto;
      margin-bottom: -7%;
      pointer-events: none;
    }
    /* 固定光源高光：纹路在底下转，光斑留在画面空间，产生真实黑胶光感 */
    .tt-sheen {
      position: absolute;
      inset: 4.5%;
      border-radius: 50%;
      background:
        conic-gradient(
          from 28deg,
          transparent 0deg,
          rgba(255, 255, 255, 0.05) 8deg,
          rgba(255, 255, 255, 0.34) 22deg,
          rgba(255, 255, 255, 0.12) 38deg,
          transparent 58deg,
          transparent 175deg,
          rgba(255, 255, 255, 0.04) 188deg,
          rgba(255, 255, 255, 0.26) 206deg,
          rgba(255, 255, 255, 0.08) 224deg,
          transparent 248deg,
          transparent 360deg
        );
      -webkit-mask: radial-gradient(closest-side, transparent 57%, #000 58.5%, #000 97%, transparent 99.5%);
      mask: radial-gradient(closest-side, transparent 57%, #000 58.5%, #000 97%, transparent 99.5%);
      mix-blend-mode: soft-light;
      opacity: 1;
      pointer-events: none;
    }
    .tt-glint {
      position: absolute;
      inset: 4.5%;
      border-radius: 50%;
      background:
        conic-gradient(
          from 34deg,
          transparent 0deg,
          transparent 12deg,
          rgba(255, 255, 255, 0.7) 20deg,
          rgba(255, 255, 255, 0.18) 27deg,
          transparent 36deg,
          transparent 196deg,
          rgba(255, 255, 255, 0.48) 208deg,
          rgba(255, 255, 255, 0.12) 217deg,
          transparent 228deg,
          transparent 360deg
        );
      -webkit-mask: radial-gradient(closest-side, transparent 57%, #000 59%, #000 96%, transparent 99%);
      mask: radial-gradient(closest-side, transparent 57%, #000 59%, #000 96%, transparent 99%);
      mix-blend-mode: screen;
      opacity: 0.5;
      pointer-events: none;
    }
    .tt.is-playing .tt-sheen {
      animation: ttSheenLive 5.5s ease-in-out infinite;
    }
    .tt.is-playing .tt-glint {
      animation: ttGlintLive 3.8s ease-in-out infinite;
    }
    @keyframes ttSheenLive {
      0%, 100% { opacity: 0.92; filter: brightness(1); }
      50% { opacity: 1; filter: brightness(1.14); }
    }
    @keyframes ttGlintLive {
      0%, 100% { opacity: 0.42; }
      40% { opacity: 0.58; }
      70% { opacity: 0.48; }
    }
    .tt-arm {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    /* Tonearm.png 原图 1086×1448：底座圆心 (832,302) 为转轴，针尖 (208,1356)，原图唱臂自带约 30.5° 倾角 */
    .tt-arm-swing {
      appearance: none;
      position: absolute;
      left: calc(var(--d) * 0.6117);
      top: calc(var(--d) * -0.0277);
      width: calc(var(--d) * 0.5851);
      height: auto;
      max-width: none;
      padding: 0;
      margin: 0;
      border: none;
      background: transparent;
      cursor: pointer;
      pointer-events: auto;
      transform-origin: 76.61% 20.86%;
      rotate: -34.5deg;
      filter: drop-shadow(0 16px 14px rgba(0, 0, 0, 0.7));
      transition: rotate 0.6s cubic-bezier(0.4, 0, 0.2, 1), filter 0.6s ease;
    }
    .tt-arm-swing img {
      display: block;
      width: 100%;
      height: auto;
      pointer-events: none;
    }
    .tt-arm-swing:hover { filter: drop-shadow(0 16px 14px rgba(0, 0, 0, 0.7)) brightness(1.08); }
    .tt-arm-swing:focus-visible {
      outline: 2px solid rgba(204, 255, 0, 0.6);
      outline-offset: 4px;
    }
    .tt.is-playing .tt-arm-swing {
      rotate: -5.5deg;

      transition: rotate 0.62s cubic-bezier(0.34, 1.25, 0.5, 1), filter 0.62s ease;
    }
    .tt.is-playing .tt-arm-swing:hover { filter: drop-shadow(0 6px 5px rgba(0, 0, 0, 0.75)) brightness(1.08); }
    .tt-controls {
      width: var(--d);
      margin-top: calc(var(--d) * 0.08);
    }
    .tt-buttons {

      gap: 28px;
    }
    .tt-btn {

        radial-gradient(circle at 40% 32%, #2a2a2e 0%, #141416 58%, #0a0a0c 100%);

    }
    .tt-btn svg { width: 15px; height: 15px; }
    .tt-btn:hover {
      color: #fff;
      border-color: rgba(210, 210, 220, 0.55);
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.18),

        inset 0 -3px 6px rgba(0, 0, 0, 0.45);
    }
    .tt-btn:active { transform: scale(0.94); }
    .tt-btn:focus-visible { outline: 2px solid rgba(204, 255, 0, 0.6); outline-offset: 3px; }
    .tt-btn.is-main {
      width: 68px;

        radial-gradient(circle at 42% 34%, #242428 0%, #121214 55%, #070708 100%);
      color: var(--lime);
      box-shadow:
        0 0 0 3px #1c1c1f,
        0 0 0 4.5px rgba(190, 190, 200, 0.45),

        radial-gradient(circle at 42% 34%, #2c2c30 0%, #161618 55%, #0a0a0c 100%);

      box-shadow:

    .tt-ico-pause,

    .home-badge {

    /* —— 首页入场编排与氛围动效 —— */
    @keyframes homeRise {
      from { opacity: 0; translate: 0 18px; }
      to { opacity: 1; translate: 0 0; }
    }
    @keyframes homePop {
      from { opacity: 0; scale: 0.9; }
      to { opacity: 1; scale: 1; }
    }
    .home-intro,
    .home-title,
    .home-stats,
    .home-badge,
    .home-actions,
    .skill-card {
      animation: homeRise 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
      animation-delay: var(--d, 0s);
    }
    .home-intro { --d: 0.05s; }
    .home-title { --d: 0.14s; }
    .home-stats { --d: 0.26s; }
    .home-badge { --d: 0.36s; }
    .home-actions { --d: 0.46s; }
    .skill-card:nth-child(1) { --d: 0.72s; }
    .skill-card:nth-child(2) { --d: 0.8s; }
    .skill-card:nth-child(3) { --d: 0.88s; }
    .skill-card:nth-child(4) { --d: 0.96s; }
    .tt-deck { animation: homePop 1.1s cubic-bezier(0.22, 1, 0.36, 1) 0.2s both; }
    .tt-controls { animation: homeRise 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.5s both; }
    @media (prefers-reduced-motion: reduce) {
      .home-intro,
      .home-title,
      .home-stats,
      .home-badge,
      .home-actions,

      .tt-deck,
      .tt-controls,

    .exp-rail-item {
      appearance: none;
      border: 0;
      background: none;
      color: rgba(255, 255, 255, 0.38);
      cursor: pointer;
      padding: 4px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      font-family: var(--font-ui);
      transition: color 0.35s var(--ease);
    }
    .exp-rail-item .exp-rail-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.28);
      background: #0a0a0c;
      transition: background 0.35s var(--ease), border-color 0.35s var(--ease), box-shadow 0.35s var(--ease), transform 0.35s var(--ease);
    }
    .exp-rail-item .exp-rail-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      font-variant-numeric: tabular-nums;
    }
    .exp-rail-item:hover { color: rgba(255, 255, 255, 0.78); }
    .exp-rail-item.is-active { color: #fff; }
    .exp-rail-item.is-active .exp-rail-dot {
      transform: scale(1.2);
      border-color: var(--lime);
      background: var(--lime);
      box-shadow: 0 0 0 4px rgba(204, 255, 0, 0.14), 0 0 14px rgba(204, 255, 0, 0.45);
    }
    .exp-rail-item.is-active .exp-rail-label { color: var(--lime); }
    .exp-rail-progress {
      position: relative;
      width: min(240px, 50%);
      height: 2px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }
    .exp-rail-progress i {
      position: absolute;
      top: 0;
      bottom: 0;
      left: calc(var(--exp-p, 0) * 100%);
      width: calc(100% / var(--exp-n, 4));
      border-radius: inherit;
      background: var(--lime);
      transition: left 0.55s var(--ease);
    }
    @media (max-width: 860px) {
      .exp-nav-btn { display: none; }
      .exp-row,
      .exp-row.is-flip,
      .exp-row.has-docs,
      .exp-row.has-apps,
      .exp-row.has-apps.is-flip {
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: auto minmax(0, 1fr) auto;
        grid-template-areas: "visual" "copy" "aside";
        overflow-y: auto;
      }
      .exp-visual.has-stats {
        height: auto;
        max-height: 160px;
        min-height: 140px;
        aspect-ratio: 7 / 4;
      }
    }

    /* —— Works 作品集：三列卡片墙（录屏封面 + 悬停播放） —— */
    .slide--works .slide-inner {
      align-items: flex-start;
      justify-content: flex-start;
      min-height: calc(100dvh - var(--header-h) - 24px);
      height: auto;
      width: 100%;
    }
    .works-theater {
      position: relative;
      width: min(1040px, 100%);
      margin: 0 auto;
    }
    .works-page-title,
    .works-filter { transition: opacity 0.3s var(--ease); }
    .works-theater.is-detail-open .works-page-title,
    .works-theater.is-detail-open .works-filter {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .works-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: clamp(44px, 5.2vw, 72px) clamp(20px, 2.6vw, 34px);
      transition: filter 0.45s var(--ease);
    }
    .works-theater.is-detail-open .works-grid {
      filter: blur(5px) saturate(0.75);
      pointer-events: none;
    }
    .works-card {
      --accent: #ccff00;
      position: relative;
      display: block;
      width: 100%;
      aspect-ratio: 3 / 2;
      padding: 0;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: #0e0e10;
      overflow: hidden;
      isolation: isolate;
      cursor: pointer;
      text-align: left;
      color: var(--text);
      font-family: var(--font-ui);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
      transition: transform 0.45s var(--ease), border-color 0.45s var(--ease), box-shadow 0.45s var(--ease);
    }
    .works-card[data-series="alarm"] { --accent: #ffb450; }
    .works-card[data-series="fish"] { --accent: #50c8dc; }
    .works-card[data-series="health"] { --accent: #78dc8c; }
    .works-card[data-series="other"] { --accent: #b49cff; }
    .works-card:hover,
    .works-card:focus-visible,
    .works-card.is-active {
      transform: perspective(900px) rotateX(var(--tilt-x, 0deg)) rotateY(var(--tilt-y, 0deg)) translateY(-4px);
      border-color: color-mix(in srgb, var(--accent) 45%, transparent);
      box-shadow: 0 24px 50px rgba(0, 0, 0, 0.5), 0 0 0 1px color-mix(in srgb, var(--accent) 18%, transparent);
    }
    .works-card:focus-visible {
      outline: 2px solid rgba(204, 255, 0, 0.55);
      outline-offset: 3px;
    }
    .works-card-cover {
      position: absolute;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      background:
        radial-gradient(ellipse 80% 70% at 50% 25%, color-mix(in srgb, var(--accent) 20%, transparent) 0%, transparent 70%),
        #0e0e10;
    }
    .works-card-cover::before {
      content: "";
      position: absolute;
      inset: -20%;
      background: var(--icon) center / cover no-repeat;
      filter: blur(48px) saturate(1.3);
      opacity: 0.5;
    }
    .works-card-cover::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 40%, rgba(10, 10, 12, 0.7) 66%, rgba(10, 10, 12, 0.96) 100%);
    }
    .works-card-phones {
      position: absolute;
      left: 50%;
      top: 8%;
      width: 66%;
      height: 100%;
      transform: translateX(-50%);
      transition: transform 0.6s var(--ease);
    }
    .works-card-phone {
      position: absolute;
      top: 8%;
      width: 36%;
      aspect-ratio: 9 / 19.5;
      padding: 3px;
      border-radius: 14px;
      background: #050506;
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.55);
      overflow: hidden;
      transition: transform 0.6s var(--ease);
    }
    .works-card-phone:nth-child(1) { left: 0; transform: rotate(-9deg); }
    .works-card-phone:nth-child(2) { left: 30%; top: 0; z-index: 2; width: 40%; }
    .works-card-phone:nth-child(3) { right: 0; transform: rotate(9deg); }
    .works-card-phone video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 11px;
      background: #111114;
    }
    .works-card:hover .works-card-phones { transform: translateX(-50%) translateY(-5%); }
    .works-card:hover .works-card-phone:nth-child(1) { transform: translateX(-8%) rotate(-12deg); }
    .works-card:hover .works-card-phone:nth-child(3) { transform: translateX(8%) rotate(12deg); }
    .works-card-meta {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px 18px 18px 20px;
    }
    .works-card-icon {
      flex: 0 0 auto;
      width: 42px;
      height: 42px;
      border-radius: 11px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.45);
    }
    .works-card-text {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .works-card-text strong,
    .works-card-text small {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .works-card-text strong {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .works-card-text small {
      font-size: 11.5px;
      color: rgba(255, 255, 255, 0.6);
    }
    .works-card-go {
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      transition: background 0.35s var(--ease), border-color 0.35s var(--ease), color 0.35s var(--ease), transform 0.35s var(--ease);
    }
    .works-card-go svg { width: 15px; height: 15px; }
    .works-card:hover .works-card-go,
    .works-card:focus-visible .works-card-go {
      background: var(--lime);
      border-color: var(--lime);
      color: #0a0a0a;
      transform: rotate(-45deg);
    }

    /* 详情浮层里的录屏手机 */
    .works-phone {
      --phone-r: 18px;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .works-phone-screen {
      position: relative;
      width: var(--phone-w);
      aspect-ratio: 720 / 1590;
      padding: 4px;
      border-radius: var(--phone-r);
      background: #050506;
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 22px 50px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 180, 80, 0.08);
      overflow: hidden;
    }
    .works-phone.is-landscape .works-phone-screen { width: calc(var(--phone-w) * var(--u, 2)); }
    .works-phone-screen::before {
      content: "";
      position: absolute;
      inset: 4px;
      z-index: 1;
      border-radius: calc(var(--phone-r) - 4px);
      background: linear-gradient(110deg, transparent 30%, rgba(255, 255, 255, 0.07) 50%, transparent 70%) 0 0 / 250% 100%;
      opacity: 0;
      transition: opacity 0.4s var(--ease);
      pointer-events: none;
    }
    .works-phone-screen.is-loading::before {
      opacity: 1;
      animation: worksShimmer 1.4s linear infinite;
    }
    @keyframes worksShimmer {
      from { background-position: 125% 0; }
      to { background-position: -125% 0; }
    }
    .works-phone.is-error .works-phone-screen::after {
      content: "视频暂不可播放";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 8px;
      font-size: 10px;
      letter-spacing: 0.06em;
      text-align: center;
      color: var(--muted);
    }
    .works-phone video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: calc(var(--phone-r) - 4px);
      background: #111114;
    }
    .works-phone figcaption {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: rgba(255, 255, 255, 0.5);
    }

    .works-detail-overlay {
      position: fixed;
      inset: 0;
      z-index: 280;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(12px, 3vw, 24px);
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.4s var(--ease), visibility 0.4s;
    }
    .works-detail-overlay.is-open {
      pointer-events: auto;
      opacity: 1;
      visibility: visible;
    }
    .works-detail-backdrop {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: rgba(0, 0, 0, 0.62);
      backdrop-filter: blur(8px);
    }
    .works-detail-backdrop::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 18%;
      width: min(70vw, 900px);
      height: 60vh;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, color-mix(in srgb, var(--detail-accent, #ccff00) 16%, transparent) 0%, transparent 68%);
      transform: translateX(-50%);
      pointer-events: none;
    }
    .works-detail-overlay.is-open .works-detail-backdrop::after {
      animation: worksSweep 1.1s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    @keyframes worksSweep {
      from { opacity: 0; transform: translateX(10%) scaleX(1.4); }
      to { opacity: 1; transform: translateX(-50%) scaleX(1); }
    }
    .works-detail-panel {
      position: relative;
      z-index: 1;
      width: min(540px, 100%);
      max-height: min(88%, calc(100dvh - var(--header-h) - 48px));
      overflow-y: auto;
      border-radius: 22px;
      border: 1px solid rgba(204, 255, 0, 0.28);
      background: linear-gradient(165deg, #141416 0%, #0a0a0c 100%);
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(204, 255, 0, 0.1);
      padding: clamp(16px, 3vw, 22px);
    }
    .works-detail-overlay.is-open .works-detail-panel:not(.has-shots) {
      animation: worksDetailIn 0.45s var(--ease) both;
    }
    @keyframes worksDetailIn {
      from { opacity: 0; transform: translateY(16px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .works-detail-close {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 32px;
      height: 32px;
      border-radius: 999px;
      border: 1px solid var(--card-border);
      background: rgba(255, 255, 255, 0.04);
      color: var(--muted);
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      font-family: var(--font-ui);
    }
    .works-detail-close:hover { color: var(--lime); border-color: rgba(204, 255, 0, 0.35); }
    .works-detail-media {
      position: relative;
      border-radius: 16px;
      border: 1px solid var(--card-border);
      background: #0d0d0f;
      aspect-ratio: 16 / 10;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-bottom: 14px;
    }
    .works-detail-media video {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: none;
    }
    .works-detail-media video.is-on { display: block; }
    .works-detail-media-fallback {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 16px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
    }
    .works-detail-media-fallback.is-hidden { display: none; }
    .works-detail-media[hidden] { display: none; }
    .works-detail-panel {
      scrollbar-width: thin;
      scrollbar-color: rgba(204, 255, 0, 0.3) transparent;
    }
    /* 有录屏时：去掉面板外框，手机悬浮排列，信息收进下方小卡片 */
    .works-detail-panel.has-shots {
      width: min(1440px, 100%);
      max-height: none;
      overflow: visible;
      padding: 0;
      border: none;
      background: none;
      box-shadow: none;
    }
    .works-detail-panel.has-shots .works-detail-close {
      top: 6px;
      right: 0;
      z-index: 3;
      background: rgba(20, 20, 22, 0.8);
    }
    .works-detail-stage {
      perspective: 1400px;
    }
    .works-detail-shots {
      --n: 5;
      --mx: 0;
      --my: 0;
      --phone-w: min(30vh, 250px);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 22px;
      margin: 0;
      padding-top: 36px;
      transform: rotateY(calc(var(--mx) * 5deg)) rotateX(calc(var(--my) * -3deg));
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .works-detail-shots[hidden] { display: none; }
    .works-detail-shots.is-scroll {
      justify-content: flex-start;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 44px 32px 40px;
      perspective: 1400px;
      scroll-snap-type: x proximity;
      scrollbar-width: thin;
      scrollbar-color: rgba(204, 255, 0, 0.35) transparent;
      -webkit-mask-image: linear-gradient(90deg, transparent, #000 32px, #000 calc(100% - 32px), transparent);
      mask-image: linear-gradient(90deg, transparent, #000 32px, #000 calc(100% - 32px), transparent);
    }
    .works-detail-shots.is-scroll .works-phone {
      flex-shrink: 0;
      scroll-snap-align: center;
    }
    .works-detail-shots .works-phone {
      --phone-r: 16px;
      position: relative;
      z-index: 0;
      animation: worksPhoneIn 1s cubic-bezier(0.16, 1, 0.3, 1) backwards;
      animation-delay: calc(var(--i, 0) * 75ms + 60ms);
      transition: scale 0.45s cubic-bezier(0.16, 1, 0.3, 1), translate 0.45s cubic-bezier(0.16, 1, 0.3, 1), filter 0.35s var(--ease);
    }
    @keyframes worksPhoneIn {
      0% { opacity: 0; transform: translateX(min(68vw, 880px)) rotateY(-38deg) rotateZ(6deg) scale(0.88); filter: blur(8px); }
      55% { opacity: 1; filter: blur(0); }
      100% { opacity: 1; transform: none; filter: none; }
    }
    .works-detail-shots .works-phone-screen {
      animation: worksFloat 5.2s ease-in-out infinite;
      animation-delay: calc(var(--i, 0) * -0.85s);
      transition: border-color 0.35s var(--ease), box-shadow 0.35s var(--ease);
    }
    @keyframes worksFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-9px); }
    }
    .works-detail-shots .works-phone::before {
      content: "";
      position: absolute;
      left: 14%;
      right: 14%;
      bottom: 12px;
      height: 16px;
      z-index: -1;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.75) 0%, transparent 70%);
      filter: blur(4px);
      animation: worksShadow 5.2s ease-in-out infinite;
      animation-delay: calc(var(--i, 0) * -0.85s);
    }
    @keyframes worksShadow {
      0%, 100% { transform: scaleX(1); opacity: 0.9; }
      50% { transform: scaleX(0.82); opacity: 0.55; }
    }
    .works-detail-shots .works-phone figcaption {
      transition: color 0.35s var(--ease), letter-spacing 0.35s var(--ease);
    }
    .works-detail-shots .works-phone:hover {
      z-index: 2;
      scale: 1.1;
      translate: 0 -8px;
    }
    .works-detail-shots .works-phone:hover .works-phone-screen {
      border-color: color-mix(in srgb, var(--detail-accent, #ccff00) 70%, transparent);
      box-shadow: 0 34px 70px rgba(0, 0, 0, 0.65), 0 0 36px color-mix(in srgb, var(--detail-accent, #ccff00) 28%, transparent);
    }
    .works-detail-shots .works-phone:hover figcaption {
      color: var(--lime);
      letter-spacing: 0.24em;
    }

    /* 有录屏时只展示主功能列表，介绍信息仅保留给读屏 */
    .works-detail-panel.has-shots .works-detail-info {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    /* 每个 slide-inner 自成层叠上下文，浮层打开时需整体抬到后续板块之上 */
    .slide--works:has(.works-theater.is-detail-open) .slide-inner { z-index: 200; }

    /* 关闭：手机依次滑回右侧 */
    .works-detail-overlay.is-closing .works-detail-shots .works-phone {
      animation: worksPhoneOut 0.42s cubic-bezier(0.55, 0, 0.75, 0.2) both;
      animation-delay: calc((var(--count, 5) - 1 - var(--i, 0)) * 28ms);
    }
    @keyframes worksPhoneOut {
      to { opacity: 0; transform: translateX(min(50vw, 640px)) rotateY(-30deg) scale(0.9); filter: blur(6px); }
    }
    .works-detail-overlay.is-closing {
      opacity: 0;
      transition-delay: 0.2s;
    }
    .works-detail-media-fallback code {
      font-size: 10px;
      color: rgba(204, 255, 0, 0.7);
    }
    .works-detail-series {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin: 0 0 6px;
    }
    .works-detail-series i {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      font-style: normal;
    }
    .works-detail-series[data-series="alarm"] i { background: #ffb450; }
    .works-detail-series[data-series="fish"] i { background: #50c8dc; }
    .works-detail-series[data-series="health"] i { background: #78dc8c; }
    .works-detail-series[data-series="other"] i { background: #b49cff; }
    .works-detail-title {
      margin: 0 0 12px;
      font-size: clamp(18px, 2.4vw, 22px);
      font-weight: 700;
      line-height: 1.3;
      padding-right: 36px;
    }
    .works-detail-rows {
      display: grid;
      gap: 8px;
      font-size: 12px;
      line-height: 1.55;
      margin: 0 0 12px;
    }
    .works-detail-rows dt { font-weight: 600; color: var(--text); display: inline; }
    .works-detail-rows dt::after { content: " · "; color: var(--muted); font-weight: 400; }
    .works-detail-rows dd { display: inline; color: var(--muted); margin: 0; }
    .works-detail-kpis {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .works-detail-kpi {
      font-size: 10px;
      padding: 5px 10px;
      border-radius: 999px;
      border: 1px solid rgba(204, 255, 0, 0.22);
      background: rgba(204, 255, 0, 0.05);
      color: var(--muted);
    }
    .works-detail-kpi em { font-style: normal; color: var(--lime); font-weight: 700; }

    /* 系列筛选 */
    .works-filter {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin: calc(var(--rhythm) * -0.35) 0 clamp(32px, 5vh, 52px);
    }
    .works-filter-btn {
      --accent: var(--lime);
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.03);
      color: rgba(255, 255, 255, 0.72);
      font-family: var(--font-ui);
      font-size: 12px;
      font-weight: 600;

    .asc-versions {

    }

    .asc-player {
      border-radius: 14px;
      overflow: hidden;
      background: #0c0c0e;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08), 0 30px 70px -30px rgba(0, 0, 0, 0.9);

      width: 9px;

      border-radius: 50%;
      background: rgba(255, 255, 255, 0.16);

      position: relative;
      aspect-ratio: 1558 / 808;

    }
    .asc-player-screen video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .asc-player-play {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 0;
      border: 0;
      background: rgba(8, 8, 10, 0.4);
      cursor: pointer;
      transition: background 0.4s var(--ease), opacity 0.3s var(--ease);
    }
    .asc-player-play span {
      display: grid;
      place-items: center;
      width: 64px;

  <script>
    (function () {
      "use strict";
      var track = null;
      var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
/* Works：三列卡片墙 + 居中详情浮层 */
      var worksTheater = document.getElementById("worksTheater");
      var worksGrid = document.getElementById("worksGrid");
      var worksCards = worksGrid ? worksGrid.querySelectorAll(".works-card") : [];
      var worksDetailOverlay = document.getElementById("worksDetailOverlay");
      var worksDetailBackdrop = document.getElementById("worksDetailBackdrop");
      var worksDetailClose = document.getElementById("worksDetailClose");
      var worksDetailVideo = document.getElementById("worksDetailVideo");
      var worksDetailFallback = document.getElementById("worksDetailFallback");
      var worksDetailVideoHint = document.getElementById("worksDetailVideoHint");
      var worksDetailSeries = document.getElementById("worksDetailSeries");
      var worksDetailTitle = document.getElementById("worksDetailTitle");
      var worksDetailScene = document.getElementById("worksDetailScene");
      var worksDetailRole = document.getElementById("worksDetailRole");
      var worksDetailHighlight = document.getElementById("worksDetailHighlight");
      var worksDetailKpis = document.getElementById("worksDetailKpis");
      var worksDetailPanel = document.getElementById("worksDetailPanel");
      var worksDetailMedia = document.getElementById("worksDetailMedia");
      var worksDetailShots = document.getElementById("worksDetailShots");
      var worksDetailHead = document.getElementById("worksDetailHead");
      var worksDetailHeadIcon = document.getElementById("worksDetailHeadIcon");
      var worksDetailHeadTitle = document.getElementById("worksDetailHeadTitle");
      var worksDetailHeadSeries = document.getElementById("worksDetailHeadSeries");
      var worksDetailHeadTagline = document.getElementById("worksDetailHeadTagline");
      var worksDetailCount = document.getElementById("worksDetailCount");
      var worksDetailPrev = document.getElementById("worksDetailPrev");
      var worksDetailNext = document.getElementById("worksDetailNext");
      var worksFilter = document.getElementById("worksFilter");
      var worksHoverCapable = window.matchMedia("(hover: hover)").matches;
      var worksOpenCard = null;

      function worksVisibleCards() {
        return Array.prototype.filter.call(worksCards, function (c) {
          return !c.classList.contains("is-filtered-out");
        });
      }

      function worksParseKpis(raw) {
        if (!raw) return [];
        return raw.split("|").map(function (s) { return s.trim(); }).filter(Boolean);
      }

      function worksBuildPhones(list, preload) {
        return list.map(function (src, i) {
          var fig = document.createElement("figure");
          fig.className = "works-phone";
          fig.style.setProperty("--i", String(i));
          var screen = document.createElement("div");
          screen.className = "works-phone-screen";
          var video = document.createElement("video");
          video.muted = true;
          video.loop = true;
          video.playsInline = true;
          video.setAttribute("muted", "");
          video.setAttribute("playsinline", "");
          video.preload = preload;
          video.addEventListener("loadedmetadata", function () {
            var w = video.videoWidth;
            var h = video.videoHeight;
            if (!w || !h) return;
            screen.style.aspectRatio = w + " / " + h;
            fig.classList.toggle("is-landscape", w > h);
            fig.style.setProperty("--u", (w > h ? w / h : 1).toFixed(3));
            worksSyncUnits(fig.parentNode);
          });
          video.addEventListener("error", function () {
            fig.classList.add("is-error");
            screen.classList.remove("is-loading");
          });
          video.addEventListener("loadeddata", function () { screen.classList.remove("is-loading"); });
          screen.classList.add("is-loading");
          if (i < 3) video.poster = encodeURI(src.replace(/([^/]+)\.mp4$/, "cover_$1.jpg"));
          video.src = encodeURI(src);
          screen.appendChild(video);
          var cap = document.createElement("figcaption");
          cap.textContent = (i < 9 ? "0" : "") + (i + 1);
          fig.appendChild(screen);
          fig.appendChild(cap);
          return fig;
        });
      }

      /* 横屏视频按「宽 / 高」倍的竖屏宽度计入，整排宽度据此缩放 */
      function worksSyncUnits(container) {
        if (!container || !container.children) return;
        var units = 0;
        Array.prototype.forEach.call(container.children, function (fig) {
          units += parseFloat(fig.style.getPropertyValue("--u")) || 1;
        });
        if (units) container.style.setProperty("--n", units.toFixed(3));
      }

      function worksPlayAll(container) {
        if (!container) return;
        container.querySelectorAll("video").forEach(function (v) {
          if (v.getAttribute("src")) v.play().catch(function () {});
        });
      }

      function worksPauseAll(container) {
        if (!container) return;
        container.querySelectorAll("video").forEach(function (v) { v.pause(); });
      }

      function worksRenderKpis(container, raw) {
        if (!container) return;
        container.innerHTML = "";
        worksParseKpis(raw).forEach(function (item) {
          var pill = document.createElement("span");
          pill.className = "works-detail-kpi";
          var segs = item.split(" ");
          if (segs.length > 1 && /^[+\d%→]/.test(segs[0])) {
            pill.innerHTML = "<em>" + segs[0] + "</em> " + segs.slice(1).join(" ");
          } else {
            pill.textContent = item;
          }
          container.appendChild(pill);
        });
      }

      function worksFillDetail(btn) {
        if (!btn) return;
        if (worksDetailSeries) {
          worksDetailSeries.textContent = "";
          var dot = document.createElement("i");
          dot.setAttribute("aria-hidden", "true");
          worksDetailSeries.appendChild(dot);
          worksDetailSeries.appendChild(document.createTextNode(" " + (btn.getAttribute("data-series-label") || "")));
          worksDetailSeries.setAttribute("data-series", btn.getAttribute("data-series") || "");
        }
        if (worksDetailTitle) worksDetailTitle.textContent = btn.getAttribute("data-title") || "";
        if (worksDetailHeadIcon) worksDetailHeadIcon.src = btn.getAttribute("data-icon") || "";
        if (worksDetailHeadTitle) worksDetailHeadTitle.textContent = btn.getAttribute("data-title") || "";
        if (worksDetailHeadSeries) worksDetailHeadSeries.textContent = btn.getAttribute("data-series-label") || "";
        if (worksDetailHeadTagline) {
          var tagline = btn.querySelector(".works-card-text small");
          worksDetailHeadTagline.textContent = tagline ? tagline.textContent : "";
        }
        if (worksDetailCount) {
          var visible = worksVisibleCards();
          var pos = visible.indexOf(btn) + 1;
          worksDetailCount.textContent = String(pos).padStart(2, "0") + " / " + String(visible.length).padStart(2, "0");
        }
        if (worksDetailScene) worksDetailScene.textContent = btn.getAttribute("data-scene") || "";
        if (worksDetailRole) worksDetailRole.textContent = btn.getAttribute("data-role") || "";
        if (worksDetailHighlight) worksDetailHighlight.textContent = btn.getAttribute("data-highlight") || "";
        worksRenderKpis(worksDetailKpis, btn.getAttribute("data-kpis"));

        var shots = worksParseKpis(btn.getAttribute("data-shots"));
        var hasShots = shots.length > 0 && !!worksDetailShots;
        if (worksDetailPanel) worksDetailPanel.classList.toggle("has-shots", hasShots);
        if (worksDetailMedia) worksDetailMedia.hidden = hasShots;
        if (worksDetailShots) {
          worksPauseAll(worksDetailShots);
          worksDetailShots.replaceChildren();
          if (hasShots) {
            worksDetailShots.removeAttribute("hidden");
            worksDetailShots.hidden = false;

      function projFeatNavUpdate() {
        if (!projFeatBody || !projFeatNav) return;
        var max = projFeatBody.scrollWidth - projFeatBody.clientWidth;
        var ratio = projFeatBody.scrollWidth ? projFeatBody.clientWidth / projFeatBody.scrollWidth : 1;
        projFeatNav.classList.toggle("is-static", max <= 2);
        projFeatNav.style.setProperty("--feat-ratio", ratio.toFixed(4));
        projFeatNav.style.setProperty("--feat-thumb", (ratio * 100).toFixed(2) + "%");
        projFeatNav.style.setProperty("--feat-pos", max > 0 ? (projFeatBody.scrollLeft / max).toFixed(4) : "0");
        if (projFeatPrev) projFeatPrev.disabled = projFeatBody.scrollLeft <= 2;
        if (projFeatNext) projFeatNext.disabled = projFeatBody.scrollLeft >= max - 2;
      }

      /* 滚轮、按钮、拖拽惯性统一走一个缓动循环；同时驱动截图的速度倾斜与远近明暗 */
      var projFeatTarget = null;
      var projFeatInertia = 0;
      var projFeatLast = 0;
      var projFeatSkew = 0;
      var projFeatRaf = 0;
      var projDrag = null;

      function projFeatMax() {
        return Math.max(0, projFeatBody.scrollWidth - projFeatBody.clientWidth);
      }

      function projFeatBump(dir) {
        if (reduced) return;
        var cls = dir < 0 ? "is-bump-start" : "is-bump-end";
        if (projFeatBody.classList.contains(cls)) return;
        projFeatBody.classList.remove("is-bump-start", "is-bump-end");
        void projFeatBody.offsetWidth;
        projFeatBody.classList.add(cls);
      }

      function projFeatScrollTo(left) {
        var max = projFeatMax();
        var from = projFeatTarget === null ? projFeatBody.scrollLeft : projFeatTarget;
        if ((left < 0 && from <= 1) || (left > max && from >= max - 1)) projFeatBump(left < 0 ? -1 : 1);
        left = Math.max(0, Math.min(max, left));
        projFeatInertia = 0;
        if (reduced) {
          projFeatBody.scrollLeft = left;
          return;
        }
        projFeatTarget = left;
        projFeatKick();
      }

      function projFeatStep(dir) {
        if (!projFeatBody) return;
        var btn = dir < 0 ? projFeatPrev : projFeatNext;
        if (btn && !reduced) {
          btn.classList.remove("is-pulse");
          void btn.offsetWidth;
          btn.classList.add("is-pulse");
        }
        var from = projFeatTarget === null ? projFeatBody.scrollLeft : projFeatTarget;
        projFeatScrollTo(from + dir * projFeatBody.clientWidth * 0.75);
      }

      function projFeatFrame() {
        projFeatRaf = 0;
        if (!projPage || !projPage.classList.contains("is-feat-open")) return;
        var max = projFeatMax();
        if (projFeatTarget !== null) {
          var diff = projFeatTarget - projFeatBody.scrollLeft;
          if (Math.abs(diff) < 0.5) {
            projFeatBody.scrollLeft = projFeatTarget;
            projFeatTarget = null;
          } else {
            projFeatBody.scrollLeft += diff * 0.16;
          }
        } else if (Math.abs(projFeatInertia) > 0.4) {
          var next = projFeatBody.scrollLeft + projFeatInertia;
          if (next <= 0 || next >= max) {
            projFeatBump(next <= 0 ? -1 : 1);
            projFeatInertia = 0;
          }
          projFeatBody.scrollLeft = Math.max(0, Math.min(max, next));
          projFeatInertia *= 0.93;
        }

        var sl = projFeatBody.scrollLeft;
        var vel = sl - projFeatLast;
        projFeatLast = sl;
        projFeatSkew += (Math.max(-5, Math.min(5, -vel * 0.12)) - projFeatSkew) * 0.18;
        projFeatBody.style.setProperty("--feat-skew", projFeatSkew.toFixed(3) + "deg");

        var box = projFeatBody.getBoundingClientRect();
        var mid = box.left + box.width / 2;
        var half = box.width / 2;
        projFeatBody.querySelectorAll(".proj-shot").forEach(function (shot) {
          var r = shot.getBoundingClientRect();
          var d = Math.min(1, Math.abs(r.left + r.width / 2 - mid) / (half + r.width * 0.25));
          shot.style.setProperty("--s", (1 - d * d * 0.07).toFixed(4));
          shot.style.setProperty("--b", (1 - d * d * 0.4).toFixed(4));
        });

        var moving = projFeatTarget !== null || Math.abs(projFeatInertia) > 0.4 || Math.abs(projFeatSkew) > 0.02 || projDrag;
        if (moving) projFeatKick();
      }

      function projFeatKick() {

        projFeatBody.addEventListener("wheel", function (e) {

          e.preventDefault();

          projDrag.lastX = e.clientX;
          projDrag.lastT = now;

          projFeatBody.classList.remove("is-dragging");
